name: Update disruptions

on:
  schedule:
    - cron: '0 5 * * *'   # Daily at 05:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force PR even if no data change'
        type: boolean
        default: false
      skip_count_check:
        description: 'Skip the day-over-day disruption count guard'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_BOT }}

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - run: uv sync

      - name: Fetch disruptions
        env:
          PRIM_TOKEN: ${{ secrets.PRIM_TOKEN }}
        run: uv run python scripts/fetch.py --force

      - name: Smoke-check generated output
        run: uv run pytest tests/ -m live -v ${{ inputs.skip_count_check && '--deselect tests/test_live_smoke.py::test_disruption_count_not_collapsed' || '' }}

      - name: Check for changes
        id: diff
        run: |
          git status --porcelain data/disruptions_hash.txt | grep -q . \
            && echo "changed=true"  >> "$GITHUB_OUTPUT" \
            || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Open PR if changed
        if: steps.diff.outputs.changed == 'true' || inputs.force == true
        env:
          GH_TOKEN: ${{ secrets.PAT_BOT }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TS=$(date -u +%H%M%S)
          BRANCH="update/disruptions-${DATE}-${TS}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/ data/
          git commit -m "chore: update disruptions ${DATE}"
          git push origin "$BRANCH"
          echo "" >> data/summary.md
          echo "[📄 snapshot.json](https://github.com/${{ github.repository }}/blob/${BRANCH}/data/snapshot.json)" >> data/summary.md
          PR_URL=$(gh pr create \
            --title "Travaux métro — ${DATE}" \
            --body-file data/summary.md \
            --base main \
            --reviewer ggrelet)
          echo "Opened $PR_URL"
          gh pr merge --auto --squash --delete-branch "$PR_URL"

  ci:
    needs: update
    uses: ./.github/workflows/ci.yml
