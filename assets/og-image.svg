<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f7f7f7"/>

  <!-- Logo (train tracks + wrench), centered vertically, left side -->
  <g transform="translate(70, 115) scale(17)">
    <!-- Train tracks -->
    <g transform="rotate(90 12 12) translate(12 12) scale(1.1) translate(-12 -12)" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M2 17 17 2"/>
      <path d="m2 14 8 8"/>
      <path d="m5 11 8 8"/>
      <path d="m8 8 8 8"/>
      <path d="m11 5 8 8"/>
      <path d="m14 2 8 8"/>
      <path d="M7 22 22 7"/>
    </g>
    <!-- Wrench -->
    <g transform="translate(12 12) scale(.6) translate(-12 -12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#222" stroke-width="2.5" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/>
      <path stroke="#E6B800" stroke-width="1" fill="#222" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/>
    </g>
  </g>

  <!-- Title: Travaux -->
  <text x="530" y="290" font-weight="700" font-size="148" fill="#222">Travaux</text>

  <!-- Title: Métro with styled M -->
  <text x="545" y="430" font-weight="700" font-size="148" fill="#222">
    <tspan fill="#E6B800" stroke="#222" stroke-width="18" paint-order="stroke fill">M</tspan>étro
  </text>
</svg>
